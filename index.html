<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اطلاعات پرداخت | خلیل عبدی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f7f3ec;
    font-family: Tahoma, Arial, sans-serif;
    color: #292622;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: #fffdf9;
    border: 1px solid #e4dacb;
    border-radius: 28px;
    padding: 30px 22px;
    box-shadow: 0 18px 50px rgba(50,40,25,.12);
    text-align: center;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 15px;
    border: 1px solid #bca98c;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #806d51;
    font-size: 27px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    margin: 8px 0 25px;
    color: #8b8073;
    font-size: 13px;
}

.info-box {
    background: #f8f4ed;
    border: 1px solid #eee4d6;
    border-radius: 17px;
    padding: 15px;
    margin-bottom: 12px;
    text-align: right;
}

.label {
    font-size: 12px;
    color: #8c8174;
    margin-bottom: 8px;
}

.value {
    direction: ltr;
    text-align: right;
    font-size: 15px;
    word-break: break-all;
}

.copy-btn {
    width: 100%;
    margin-top: 11px;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: #292622;
    color: white;
    font-size: 13px;
    cursor: pointer;
}

.footer {
    margin-top: 20px;
    color: #978c7e;
    font-size: 11px;
    line-height: 1.9;
}

.toast {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #292622;
    color: white;
    padding: 11px 20px;
    border-radius: 30px;
    font-size: 12px;
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">✦</div>

    <h1>خلیل عبدی</h1>

    <div class="subtitle">
        اطلاعات پرداخت
    </div>


    <div class="info-box">

        <div class="label">شماره کارت</div>

        <div class="value">
            6219 8618 1869 7012
        </div>

        <button class="copy-btn"
        onclick="copyText('6219861818697012')">
            کپی شماره کارت
        </button>

    </div>


    <div class="info-box">

        <div class="label">شماره شبا</div>

        <div class="value">
            IR230560611828006149986701
        </div>

        <button class="copy-btn"
        onclick="copyText('IR230560611828006149986701')">
            کپی شماره شبا
        </button>

    </div>


    <div class="info-box">

        <div class="label">شماره موبایل</div>

        <div class="value">
            09379298262
        </div>

        <button class="copy-btn"
        onclick="copyText('09187916341')">
            کپی شماره موبایل
        </button>

    </div>


    <div class="footer">
Novabeauty.face 
    </div>

</div>


<div class="toast" id="toast">
    کپی شد ✓
</div>


<script>

function copyText(text) {

    /* روش اول: Clipboard API */
    if (navigator.clipboard && window.isSecureContext) {

        navigator.clipboard.writeText(text)
        .then(function() {
            showToast("کپی شد ✓");
        })
        .catch(function() {
            oldCopy(text);
        });

    } else {

        /* روش جایگزین برای مرورگرهای داخلی */
        oldCopy(text);

    }
}


function oldCopy(text) {

    var input = document.createElement("textarea");

    input.value = text;

    input.style.position = "fixed";
    input.style.left = "-9999px";
    input.style.top = "0";

    document.body.appendChild(input);

    input.focus();
    input.select();

    try {

        var successful = document.execCommand("copy");

        if (successful) {
            showToast("کپی شد ✓");
        } else {
            showToast("متن را لمس و کپی کنید");
        }

    } catch (err) {

        showToast("متن را لمس و کپی کنید");

    }

    document.body.removeChild(input);
}


function showToast(message) {

    var toast = document.getElementById("toast");

    toast.innerText = message;

    toast.style.display = "block";

    setTimeout(function() {
        toast.style.display = "none";
    }, 1600);
}

</script>

</body>
</html>
