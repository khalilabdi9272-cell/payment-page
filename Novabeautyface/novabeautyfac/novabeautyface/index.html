<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova Beauty | آنالیز زیبایی</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f7f3ec;
  color:#3f4635;
  font-family:Tahoma,Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:5px 0;
  font-size:24px;
  color:#4d593e;
}

.header p{
  margin:0;
  font-size:13px;
  color:#777;
}

.face-box{
  position:relative;
  width:100%;
  max-width:430px;
  margin:0 auto;
  border-radius:24px;
  overflow:hidden;
  background:#eee;
  box-shadow:0 8px 25px rgba(0,0,0,.10);
  touch-action:none;
}

.face-box img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

.hotspot{
  position:absolute;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#78845e;
  border:3px solid rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);
  z-index:5;
  cursor:grab;
  touch-action:none;
}

.hotspot.active{
  width:20px;
  height:20px;
  background:#b49b62;
  box-shadow:0 0 0 5px rgba(180,155,98,.18);
}

.edit-mode{
  margin:14px 0;
  padding:12px;
  border-radius:14px;
  background:#ebe6da;
  text-align:center;
  font-size:12px;
  color:#666;
}

.edit-mode strong{
  color:#4d593e;
}

button{
  font-family:inherit;
}

.info{
  margin-top:18px;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.info h2{
  margin-top:0;
  color:#4d593e;
  font-size:20px;
}

.info p{
  line-height:2;
  font-size:14px;
  color:#555;
}

.consult-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#596646;
  color:#fff;
  font-size:15px;
  margin-top:10px;
}

.save-btn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:14px;
  background:#b49b62;
  color:#fff;
  font-size:14px;
  margin-top:10px;
}

.reset-btn{
  width:100%;
  border:1px solid #aaa;
  padding:11px;
  border-radius:14px;
  background:#fff;
  color:#666;
  font-size:13px;
  margin-top:8px;
}

.form{
  display:none;
  margin-top:18px;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.form input,
.form textarea,
.form select{
  width:100%;
  margin-bottom:12px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-family:inherit;
  font-size:14px;
}

.form textarea{
  min-height:100px;
  resize:vertical;
}

.submit{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#596646;
  color:white;
  font-size:15px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Nova Beauty</h1>
    <p>آنالیز و مشاوره زیبایی</p>
  </div>

  <div class="face-box" id="faceBox">

    <img src="face.jpg" id="faceImage" alt="Nova Beauty">

    <!-- نقاط -->
    <div class="hotspot" data-id="forehead" data-name="پیشانی و ابروها"></div>
    <div class="hotspot" data-id="frown" data-name="خط اخم"></div>
    <div class="hotspot" data-id="crow" data-name="پنجه‌کلاغی / دور چشم"></div>
    <div class="hotspot" data-id="cheek" data-name="گونه"></div>
    <div class="hotspot" data-id="smileline" data-name="خط خنده"></div>
    <div class="hotspot" data-id="jaw" data-name="زاویه فک"></div>
    <div class="hotspot" data-id="chin" data-name="چانه"></div>
    <div class="hotspot" data-id="lips" data-name="لب"></div>

  </div>

  <div class="edit-mode">
    <strong>تنظیم نقاط:</strong>
    هر نقطه را با انگشت بگیر و به محل دقیق موردنظر بکش.
    سپس روی «ذخیره جای نقاط» بزن.
  </div>

  <button class="save-btn" onclick="savePositions()">
    ذخیره جای نقاط
  </button>

  <button class="reset-btn" onclick="resetPositions()">
    بازگردانی نقاط به حالت اولیه
  </button>

  <div class="info" id="info">
    <h2>یک ناحیه را انتخاب کنید</h2>
    <p>
      برای مشاهده اطلاعات هر ناحیه، روی نقطه مربوط به آن لمس کنید.
    </p>
  </div>

  <div class="form" id="consultForm">

    <h2>درخواست مشاوره</h2>

    <input id="name" type="text" placeholder="نام و نام خانوادگی">

    <input id="phone" type="tel" placeholder="شماره موبایل">

    <select id="area">
      <option value="">ناحیه موردنظر</option>
      <option>پیشانی و ابروها</option>
      <option>خط اخم</option>
      <option>پنجه‌کلاغی / دور چشم</option>
      <option>گونه</option>
      <option>خط خنده</option>
      <option>زاویه فک</option>
      <option>چانه</option>
      <option>لب</option>
      <option>بوتاکس میگرن</option>
      <option>بوتاکس تعریق زیر بغل</option>
    </select>

    <textarea id="message" placeholder="توضیحات یا درخواست شما"></textarea>

    <input id="photos" type="file" accept="image/*" multiple>

    <button class="submit" onclick="submitConsultation()">
      ارسال درخواست مشاوره
    </button>

  </div>

</div>

<script>

/* =========================
   اطلاعات نواحی
========================= */

const data = {

  forehead:{
    title:"پیشانی و ابروها",
    text:"روش اصلاحی برای خطوط داینامیک پیشانی، بوتاکس است. این روش می‌تواند به کاهش ظاهر خطوط پیشانی، فرم‌دهی و لیفت ظاهری ابرو، کاهش خط اخم و کاهش ظاهر پنجه‌کلاغی کمک کند."
  },

  frown:{
    title:"خط اخم",
    text:"خط اخم معمولاً هنگام اخم کردن واضح‌تر می‌شود. بوتاکس می‌تواند با کاهش فعالیت عضلات این ناحیه، به کاهش ظاهر خطوط اخم کمک کند."
  },

  crow:{
    title:"پنجه‌کلاغی / دور چشم",
    text:"خطوط اطراف چشم که هنگام خندیدن یا جمع شدن چشم‌ها بیشتر دیده می‌شوند، می‌توانند با بوتاکس به صورت موقت کاهش پیدا کنند."
  },

  cheek:{
    title:"گونه",
    text:"روش اصلاحی برای گونه، تزریق فیلر است که می‌تواند به فرم‌دهی و حجم‌دهی گونه و بهبود ظاهر خط خنده کمک کند. برای افرادی که گونه پرتر یا کات گونه مشخص‌تری می‌خواهند مناسب است."
  },

  smileline:{
    title:"خط خنده",
    text:"کاهش وزن، افزایش سن و شل شدن پوست می‌توانند در ایجاد یا بیشتر دیده شدن خط خنده نقش داشته باشند. فیلر در ناحیه گونه و خط خنده می‌تواند برای بهبود ظاهر این ناحیه استفاده شود. در برخی افراد، تمرکز بیشتر روی گونه و حجم کمتر در خود خط خنده می‌تواند نتیجه طبیعی‌تری ایجاد کند."
  },

  jaw:{
    title:"زاویه فک",
    text:"فیلر می‌تواند برای افرادی که زاویه فک گرد دارند یا زاویه فک مشخصی ندارند، با هدف ایجاد فرم مشخص‌تر در قسمت پایین صورت مورد استفاده قرار گیرد."
  },

  chin:{
    title:"چانه",
    text:"فیلر می‌تواند برای اصلاح برخی ناهماهنگی‌های ظاهری، عدم تقارن، چانه کوچک یا فرم‌هایی که مورد پسند فرد نیستند مورد استفاده قرار گیرد."
  },

  lips:{
    title:"لب",
    text:"فیلر لب می‌تواند برای افزایش حجم، اصلاح برخی ناهماهنگی‌های ظاهری، اصلاح اختلاف حجم دو لب، ایجاد فرم دلخواه و مشخص‌تر شدن خط لب استفاده شود."
  }

};

/* =========================
   نقاط اولیه
   درصدی هستند
   ========================= */

const defaultPositions = {

  forehead:{x:50,y:25},
  frown:{x:50,y:35},
  crow:{x:72,y:40},
  cheek:{x:67,y:51},
  smileline:{x:69,y:59},
  jaw:{x:64,y:78},
  chin:{x:50,y:83},
  lips:{x:50,y:66}

};

const faceBox = document.getElementById("faceBox");
const hotspots = document.querySelectorAll(".hotspot");

/* =========================
   بارگذاری موقعیت‌های ذخیره‌شده
========================= */

let savedPositions =
  JSON.parse(localStorage.getItem("novaHotspots")) ||
  defaultPositions;

/* =========================
   قرار دادن نقاط
========================= */

function setPosition(point,x,y){

  point.style.left = x + "%";
  point.style.top = y + "%";

}

hotspots.forEach(point => {

  const id = point.dataset.id;

  if(savedPositions[id]){
    setPosition(
      point,
      savedPositions[id].x,
      savedPositions[id].y
    );
  }

});

/* =========================
   جابه‌جایی با انگشت
========================= */

let dragging = null;

hotspots.forEach(point => {

  point.addEventListener("pointerdown", function(e){

    e.preventDefault();

    dragging = point;

    point.classList.add("active");

    point.setPointerCapture(e.pointerId);

  });

  point.addEventListener("pointermove", function(e){

    if(dragging !== point) return;

    const rect = faceBox.getBoundingClientRect();

    let x =
      ((e.clientX - rect.left) / rect.width) * 100;

    let y =
      ((e.clientY - rect.top) / rect.height) * 100;

    x = Math.max(2, Math.min(98, x));
    y = Math.max(2, Math.min(98, y));

    setPosition(point,x,y);

  });

  point.addEventListener("pointerup", function(){

    dragging = null;

    point.classList.remove("active");

  });

  point.addEventListener("pointercancel", function(){

    dragging = null;

    point.classList.remove("active");

  });

  /* لمس معمولی برای نمایش اطلاعات */

  point.addEventListener("click", function(e){

    if(dragging) return;

    showInfo(point.dataset.id);

  });

});

/* =========================
   نمایش اطلاعات
========================= */

function showInfo(id){

  const item = data[id];

  if(!item) return;

  hotspots.forEach(p =>
    p.classList.remove("active")
  );

  const selected =
    document.querySelector(
      `.hotspot[data-id="${id}"]`
    );

  if(selected)
    selected.classList.add("active");

  document.getElementById("info").innerHTML = `

    <h2>${item.title}</h2>

    <p>${item.text}</p>

    <button
      class="consult-btn"
      onclick="openConsult('${item.title}')">
      درخواست مشاوره برای این ناحیه
    </button>

  `;

}

/* =========================
   ذخیره نقاط
========================= */

function savePositions(){

  const positions = {};

  hotspots.forEach(point => {

    positions[point.dataset.id] = {

      x: parseFloat(point.style.left),

      y: parseFloat(point.style.top)

    };

  });

  localStorage.setItem(
    "novaHotspots",
    JSON.stringify(positions)
  );

  alert("جای نقاط با موفقیت ذخیره شد.");

}

/* =========================
   بازگردانی
========================= */

function resetPositions(){

  localStorage.removeItem("novaHotspots");

  hotspots.forEach(point => {

    const id = point.dataset.id;

    setPosition(
      point,
      defaultPositions[id].x,
      defaultPositions[id].y
    );

  });

  alert("نقاط به حالت اولیه برگشتند.");

}

/* =========================
   فرم مشاوره
========================= */

function openConsult(area){

  document.getElementById("consultForm").style.display = "block";

  document.getElementById("area").value = area;

  document.getElementById("consultForm")
    .scrollIntoView({
      behavior:"smooth"
    });

}

/* =========================
   ارسال فرم
========================= */

function submitConsultation(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const area =
    document.getElementById("area").value;

  const message =
    document.getElementById("message").value.trim();

  if(!name || !phone || !area){

    alert("لطفاً نام، شماره موبایل و ناحیه موردنظر را وارد کنید.");

    return;

  }

  /*
    اتصال واقعی به تلگرام را بعداً اضافه می‌کنیم.
  */

  alert(
    "درخواست شما ثبت شد.\n\n" +
    "در نسخه بعدی، اطلاعات و عکس‌ها مستقیماً برای شما ارسال می‌شوند."
  );

}

</script>

</body>
</html>
