<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova Beauty | آنالیز زیبایی</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f7f3ec;
  color:#3f4635;
  font-family:Tahoma,Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:5px 0;
  font-size:24px;
  color:#4d593e;
}

.header p{
  margin:0;
  font-size:13px;
  color:#777;
}

.face-box{
  position:relative;
  width:100%;
  max-width:430px;
  margin:0 auto;
  border-radius:24px;
  overflow:hidden;
  background:#eee;
  box-shadow:0 8px 25px rgba(0,0,0,.10);

}

.face-box img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

.hotspot{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#78845e;
  border:3px solid rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);
  z-index:5;
  cursor:pointer;
}

.hotspot.active{
  width:19px;
  height:19px;
  background:#b49b62;
  box-shadow:0 0 0 5px rgba(180,155,98,.18);
}

.info{
  margin-top:18px;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.info h2{
  margin-top:0;
  color:#4d593e;
  font-size:20px;
}

.info p{
  line-height:2;
  font-size:14px;
  color:#555;
}

.consult-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#596646;
  color:#fff;
  font-size:15px;
  margin-top:10px;
}

.form{
  display:none;
  margin-top:18px;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.form input,
.form textarea,
.form select{
  width:100%;
  margin-bottom:12px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-family:inherit;
  font-size:14px;
}

.form textarea{
  min-height:100px;
  resize:vertical;
}

.submit{
  width:100%;
  border:0;
  padding:14px;
  border-radius:14px;
  background:#596646;
  color:white;
  font-size:15px;
}

.submit:disabled{
  opacity:.6;
}

.note{
  text-align:center;
  font-size:12px;
  color:#888;
  margin-top:15px;
  line-height:1.8;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Nova Beauty</h1>
    <p>آنالیز و مشاوره زیبایی</p>
  </div>

  <div class="face-box" id="faceBox">

    <img src="face.jpg" alt="Nova Beauty">

    <div class="hotspot" data-id="forehead"></div>
    <div class="hotspot" data-id="frown"></div>
    <div class="hotspot" data-id="crow"></div>
    <div class="hotspot" data-id="cheek"></div>
    <div class="hotspot" data-id="smileline"></div>
    <div class="hotspot" data-id="jaw"></div>
    <div class="hotspot" data-id="chin"></div>
    <div class="hotspot" data-id="lips"></div>

  </div>

  <!-- خدمات ویژه -->

  <div class="info">

    <h2>خدمات ویژه</h2>

    <p>
      علاوه بر نواحی صورت، می‌توانید درباره خدمات زیر نیز اطلاعات دریافت کنید.
    </p>

    <button
      class="consult-btn"
      onclick="openConsult('بوتاکس میگرن')">
      🧠 بوتاکس میگرن
    </button>

    <button
      class="consult-btn"
      onclick="openConsult('بوتاکس تعریق زیر بغل')">
      💧 بوتاکس تعریق زیر بغل
    </button>

  </div>

  <div class="info" id="info">

    <h2>یک ناحیه را انتخاب کنید</h2>

    <p>
      برای مشاهده اطلاعات هر ناحیه، روی نقطه مربوط به آن لمس کنید.
    </p>

  </div>

  <div class="form" id="consultForm">

    <h2>درخواست مشاوره</h2>

    <input id="name" type="text" placeholder="نام و نام خانوادگی">

    <input id="phone" type="tel" placeholder="شماره موبایل">

    <select id="area">

      <option value="">ناحیه موردنظر</option>

      <option>پیشانی و ابروها</option>
      <option>خط اخم</option>
      <option>پنجه‌کلاغی / دور چشم</option>
      <option>گونه</option>
      <option>خط خنده</option>
      <option>زاویه فک</option>
      <option>چانه</option>
      <option>لب</option>
      <option>بوتاکس میگرن</option>
      <option>بوتاکس تعریق زیر بغل</option>

    </select>

    <textarea
      id="message"
      placeholder="توضیحات یا درخواست شما"></textarea>

    <input
      id="photos"
      type="file"
      accept="image/*"
      multiple>

    <button
      class="submit"
      id="submitBtn"
      onclick="submitConsultation()">

      ارسال درخواست مشاوره

    </button>

  </div>

  <div class="note">
    برای بررسی دقیق‌تر، عکس‌های موردنیاز هر ناحیه را ارسال کنید.
  </div>

</div>

<script>

/* =========================
   اطلاعات نواحی
========================= */

const data = {

  forehead:{
    title:"پیشانی و ابروها",
    text:"روش اصلاحی برای خطوط داینامیک پیشانی، بوتاکس است. این روش می‌تواند به کاهش ظاهر خطوط پیشانی، فرم‌دهی و لیفت ظاهری ابرو، کاهش خط اخم و کاهش ظاهر پنجه‌کلاغی کمک کند."
  },

  frown:{
    title:"خط اخم",
    text:"خط اخم معمولاً هنگام اخم کردن واضح‌تر می‌شود. بوتاکس می‌تواند با کاهش فعالیت عضلات این ناحیه، به کاهش ظاهر خطوط اخم کمک کند."
  },

  crow:{
    title:"پنجه‌کلاغی / دور چشم",
    text:"خطوط اطراف چشم که هنگام خندیدن یا جمع شدن چشم‌ها بیشتر دیده می‌شوند، می‌توانند با بوتاکس به صورت موقت کاهش پیدا کنند."
  },

  cheek:{
    title:"گونه",
    text:"روش اصلاحی برای گونه، تزریق فیلر است که می‌تواند به فرم‌دهی و حجم‌دهی گونه و بهبود ظاهر خط خنده کمک کند. برای افرادی که گونه پرتر یا کات گونه مشخص‌تری می‌خواهند مناسب است."
  },

  smileline:{
    title:"خط خنده",
    text:"کاهش وزن، افزایش سن و شل شدن پوست می‌توانند در ایجاد یا بیشتر دیده شدن خط خنده نقش داشته باشند. فیلر در ناحیه گونه و خط خنده می‌تواند برای بهبود ظاهر این ناحیه استفاده شود. در برخی افراد، تمرکز بیشتر روی گونه و حجم کمتر در خود خط خنده می‌تواند نتیجه طبیعی‌تری ایجاد کند."
  },

  jaw:{
    title:"زاویه فک",
    text:"فیلر می‌تواند برای افرادی که زاویه فک گرد دارند یا زاویه فک مشخصی ندارند، با هدف ایجاد فرم مشخص‌تر در قسمت پایین صورت مورد استفاده قرار گیرد."
  },

  chin:{
    title:"چانه",
    text:"فیلر می‌تواند برای اصلاح برخی ناهماهنگی‌های ظاهری، عدم تقارن، چانه کوچک یا فرم‌هایی که مورد پسند فرد نیستند مورد استفاده قرار گیرد."
  },

  lips:{
    title:"لب",
    text:"فیلر لب می‌تواند برای افزایش حجم، اصلاح برخی ناهماهنگی‌های ظاهری، اصلاح اختلاف حجم دو لب، ایجاد فرم دلخواه و مشخص‌تر شدن خط لب استفاده شود."
  },

  migraine:{
    title:"بوتاکس میگرن",
    text:"در برخی افراد مبتلا به میگرن مزمن، تزریق بوتاکس می‌تواند به کاهش تعداد و شدت روزهای همراه با سردرد کمک کند. این روش برای همه انواع سردرد مناسب نیست و انتخاب آن به شرایط فرد و تشخیص مناسب بستگی دارد."
  },

  underarm:{
    title:"بوتاکس تعریق زیر بغل",
    text:"بوتاکس می‌تواند با کاهش موقت فعالیت غدد عرق، به کاهش تعریق بیش‌ازحد در ناحیه زیر بغل کمک کند. اثر آن موقتی است و معمولاً پس از مدتی نیاز به تکرار درمان وجود دارد."
  }

};

/* =========================
   مختصات نقاط
========================= */

const positions = {

  forehead:{x:51.9264,y:27.5217},

  frown:{x:49.893,y:42.3392},

  crow:{x:86.0659,y:46.5114},

  cheek:{x:78.1731,y:60.4054},

  smileline:{x:65.4377,y:65.823},

  jaw:{x:80.3136,y:71.9581},

  chin:{x:49.3044,y:84.5513},

  lips:{x:49.9465,y:72.5322}

};

/* =========================
   قرار دادن نقاط
========================= */

document.querySelectorAll(".hotspot").forEach(point => {

  const id = point.dataset.id;

  if(positions[id]){

    point.style.left = positions[id].x + "%";

    point.style.top = positions[id].y + "%";

  }

});

/* =========================
   نمایش اطلاعات
========================= */

document.querySelectorAll(".hotspot").forEach(point => {

  point.addEventListener("click", function(){

    const id = point.dataset.id;

    const item = data[id];

    if(!item) return;

    document.querySelectorAll(".hotspot")
      .forEach(p => p.classList.remove("active"));

    point.classList.add("active");

    document.getElementById("info").innerHTML = `

      <h2>${item.title}</h2>

      <p>${item.text}</p>

      <button
        class="consult-btn"
        onclick="openConsult('${item.title}')">

        درخواست مشاوره برای این ناحیه

      </button>

    `;

  });

});

/* =========================
   باز کردن فرم
========================= */

function openConsult(area){

  document.getElementById("consultForm").style.display = "block";

  document.getElementById("area").value = area;

  document.getElementById("consultForm")
    .scrollIntoView({
      behavior:"smooth"
    });

}

/* =========================
   ارسال درخواست به تلگرام
========================= */

function submitConsultation(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const area =
    document.getElementById("area").value;

  const message =
    document.getElementById("message").value.trim();

  const photosInput =
    document.getElementById("photos");

  if(!name || !phone || !area){

    alert(
      "لطفاً نام، شماره موبایل و ناحیه موردنظر را وارد کنید."
    );

    return;
  }

  const submitBtn =
    document.getElementById("submitBtn");

  submitBtn.disabled = true;

  submitBtn.innerText = "در حال ارسال...";

  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbzNPyfqi9lzCfoTZCsjF6S-lYESxVLpYNE3aDqy9lX7I4Jzbp3tjxxlSgbk0mn0S2-wdw/exec";

  const photoPromises = [];

  for(let i = 0; i < photosInput.files.length; i++){

    const file = photosInput.files[i];

    photoPromises.push(

      new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = function(){

          const base64 =
            reader.result.split(",")[1];

          resolve({

            name: file.name,

            type: file.type,

            data: base64

          });

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

      })

    );

  }

  Promise.all(photoPromises)

    .then(function(photos){

      const data = {

        name: name,

        phone: phone,

        area: area,

        message: message,

        photos: photos

      };

      return fetch(WEB_APP_URL, {

        method:"POST",

        body:JSON.stringify(data)

      });

    })

    .then(function(response){

      return response.text();

    })

    .then(function(result){

      alert(
        "درخواست شما با موفقیت ارسال شد."
      );

      document.getElementById("name").value = "";

      document.getElementById("phone").value = "";

      document.getElementById("area").value = "";

      document.getElementById("message").value = "";

      document.getElementById("photos").value = "";

      submitBtn.disabled = false;

      submitBtn.innerText =
        "ارسال درخواست مشاوره";

    })

    .catch(function(error){

      alert(
        "ارسال درخواست انجام نشد. لطفاً دوباره تلاش کنید."
      );

      submitBtn.disabled = false;

      submitBtn.innerText =
        "ارسال درخواست مشاوره";

    });

}

</script>

</body>
</html>
